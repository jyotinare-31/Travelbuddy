<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Login - TravelBuddy Travel Planner</title>
  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#0F172A",
            "secondary": "#0D9488",
            "secondary-dark": "#0B7269",
            "secondary-container": "#CCFBF1",
            "on-secondary": "#FFFFFF",
            "surface": "#F8FAFC",
            "surface-white": "#FFFFFF",
            "surface-container": "#F1F5F9",
            "surface-container-low": "#F8FAFC",
            "surface-container-high": "#E2E8F0",
            "on-surface": "#0F172A",
            "on-surface-variant": "#475569",
            "text-muted": "#64748B",
            "text-main": "#0F172A",
            "outline-variant": "#CBD5E1",
            "error": "#EF4444",
            "error-container": "#FEE2E2",
            "primary-container": "#1E293B",
            "on-primary-container": "#94A3B8"
          },
          fontFamily: {
            "headline-xl": ["Montserrat", "sans-serif"],
            "headline-lg": ["Montserrat", "sans-serif"],
            "headline-md": ["Montserrat", "sans-serif"],
            "body-lg": ["Inter", "sans-serif"],
            "body-md": ["Inter", "sans-serif"],
            "label-md": ["Inter", "sans-serif"],
            "label-sm": ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
</head>
<body class="bg-[#F8FAFC] font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center">

  <!-- Back to Home Floating Link -->
  <a href="../smarttour_home_2/code.html" class="fixed top-5 left-5 z-30 inline-flex items-center gap-2 rounded-full bg-white/90 px-4 py-2 text-xs font-semibold text-slate-700 shadow-md backdrop-blur border border-slate-200/80 hover:bg-white hover:text-secondary transition">
    <span class="material-symbols-outlined text-[18px]">arrow_back</span>
    Back to Home
  </a>

  <main class="w-full min-h-screen flex items-center justify-center relative py-12 px-4">
    <!-- Scenic Background with soft overlay -->
    <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80')"></div>
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm"></div>

    <!-- Login Card Container -->
    <div class="relative z-10 w-full max-w-md bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 md:p-10 border border-white/40">
      
      <!-- Brand Logo & Header -->
      <div class="flex flex-col items-center text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-teal-50 border border-teal-100 flex items-center justify-center text-secondary mb-4 shadow-sm">
          <span class="material-symbols-outlined text-3xl">travel_explore</span>
        </div>
        <h1 class="font-headline-lg text-2xl md:text-3xl font-bold text-slate-900 tracking-tight mb-1.5">Welcome Back</h1>
        <p class="text-sm text-slate-500">Sign in to your TravelBuddy account</p>
      </div>

      <!-- Feedback Banners -->
      <div id="login-error-msg" class="hidden mb-6 p-3.5 rounded-xl bg-error-container text-error text-xs font-medium flex items-start gap-2.5 border border-red-200">
        <span class="material-symbols-outlined text-lg shrink-0 mt-0.5">error</span>
        <div id="login-error-text" class="flex-grow leading-relaxed"></div>
      </div>

      <div id="login-success-msg" class="hidden mb-6 p-3.5 rounded-xl bg-teal-50 text-secondary text-xs font-semibold flex items-center gap-2.5 border border-teal-200">
        <span class="material-symbols-outlined text-lg shrink-0 text-secondary">check_circle</span>
        <span id="login-success-text">Login successful! Redirecting to TravelBuddy...</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-5" novalidate>
        
        <!-- Email Input -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600" for="email">Email Address</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">mail</span>
            <input 
              class="w-full pl-11 pr-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:bg-white transition" 
              id="email" 
              name="email"
              type="email" 
              placeholder="e.g., alex@wanderer.com" 
              required 
              autocomplete="email"
            />
          </div>
        </div>

        <!-- Password Input -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600" for="password">Password</label>
            <a href="#" onclick="alert('Demo Mode: You can sign in using password: password123'); return false;" class="text-xs text-secondary hover:underline font-medium">Forgot password?</a>
          </div>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg">lock</span>
            <input 
              class="w-full pl-11 pr-11 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:bg-white transition" 
              id="password" 
              name="password"
              type="password" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            />
            <button 
              type="button" 
              id="togglePasswordBtn" 
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition"
              title="Toggle password visibility"
            >
              <span class="material-symbols-outlined text-lg" id="passwordToggleIcon">visibility_off</span>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded text-secondary focus:ring-secondary border-slate-300" checked/>
            <span class="text-xs text-slate-600 font-medium">Remember my email</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button 
          id="login-btn" 
          type="submit" 
          class="w-full py-3.5 px-4 bg-secondary hover:bg-secondary-dark text-white rounded-xl font-label-md text-sm font-semibold shadow-lg hover:shadow-teal-500/25 active:scale-[0.99] transition duration-200 flex items-center justify-center gap-2"
        >
          <span id="login-btn-spinner" class="hidden animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
          <span id="login-btn-text">Sign In to TravelBuddy</span>
          <span class="material-symbols-outlined text-lg" id="login-btn-arrow">arrow_forward</span>
        </button>

      </form>

      <!-- Quick Demo Accounts -->
      <div class="mt-6 pt-5 border-t border-slate-100">
        <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 text-center mb-3">One-Click Demo Sign In</p>
        <div class="grid grid-cols-2 gap-2">
          <button 
            type="button" 
            onclick="quickFill('alex@wanderer.com', 'password123')" 
            class="px-2.5 py-2 text-xs bg-slate-50 hover:bg-teal-50 hover:text-secondary rounded-lg border border-slate-200/80 font-medium text-slate-700 transition truncate text-left flex items-center gap-1.5"
          >
            <span>👤</span>
            <span class="truncate">Alex Wanderer</span>
          </button>
          <button 
            type="button" 
            onclick="quickFill('priya.sharma@example.com', 'password123')" 
            class="px-2.5 py-2 text-xs bg-slate-50 hover:bg-teal-50 hover:text-secondary rounded-lg border border-slate-200/80 font-medium text-slate-700 transition truncate text-left flex items-center gap-1.5"
          >
            <span>👤</span>
            <span class="truncate">Priya Sharma</span>
          </button>
        </div>
      </div>

      <!-- Registration Link -->
      <div class="mt-6 text-center text-xs text-slate-500">
        Don't have an account yet? 
        <a href="../register_smarttour/code.html" class="font-semibold text-secondary hover:text-secondary-dark underline transition ml-1">
          Create an Account
        </a>
      </div>

    </div>
  </main>

  <!-- Login Logic Script -->
  <script>
    const API_BASE = 'http://localhost:8081/api';

    document.addEventListener('DOMContentLoaded', () => {
      // Restore remembered email if available
      const savedEmail = localStorage.getItem('smarttour_remember_email');
      const emailInput = document.getElementById('email');
      if (savedEmail) {
        emailInput.value = savedEmail;
        document.getElementById('password').focus();
      } else {
        emailInput.focus();
      }

      // Password visibility toggle
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const pwdInput = document.getElementById('password');
      const toggleIcon = document.getElementById('passwordToggleIcon');
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        toggleIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
      });

      // Form submission
      const loginForm = document.getElementById('loginForm');
      loginForm.addEventListener('submit', handleLogin);
    });

    function quickFill(email, pwd) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pwd;
      document.getElementById('login-error-msg').classList.add('hidden');
    }

    async function handleLogin(e) {
      e.preventDefault();

      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const rememberCheckbox = document.getElementById('rememberMe');

      const errBox = document.getElementById('login-error-msg');
      const errText = document.getElementById('login-error-text');
      const succBox = document.getElementById('login-success-msg');
      const succText = document.getElementById('login-success-text');

      const submitBtn = document.getElementById('login-btn');
      const btnText = document.getElementById('login-btn-text');
      const btnSpinner = document.getElementById('login-btn-spinner');
      const btnArrow = document.getElementById('login-btn-arrow');

      errBox.classList.add('hidden');
      succBox.classList.add('hidden');

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Validation
      if (!email) {
        showError('Please enter your email address.');
        emailInput.focus();
        return;
      }
      if (!email.includes('@') || !email.includes('.')) {
        showError('Please enter a valid email address.');
        emailInput.focus();
        return;
      }
      if (!password) {
        showError('Please enter your password.');
        passwordInput.focus();
        return;
      }

      // Loading state
      submitBtn.disabled = true;
      btnSpinner.classList.remove('hidden');
      btnArrow.classList.add('hidden');
      btnText.textContent = 'Signing In...';

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Authentication failed. Please check your credentials.');
        }

        // Store JWT token and user info
        localStorage.setItem('smarttour_token', data.token);
        localStorage.setItem('smarttour_user', JSON.stringify(data.user));
        localStorage.setItem('travelbuddy_token', data.token);
        localStorage.setItem('travelbuddy_user', JSON.stringify(data.user));
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        // Handle remember me
        if (rememberCheckbox.checked) {
          localStorage.setItem('smarttour_remember_email', email);
          localStorage.setItem('travelbuddy_remember_email', email);
        } else {
          localStorage.removeItem('smarttour_remember_email');
          localStorage.removeItem('travelbuddy_remember_email');
        }

        // Show success
        succText.textContent = `Welcome, ${data.user.fullName}! Redirecting...`;
        succBox.classList.remove('hidden');

        // Determine destination redirect
        const params = new URLSearchParams(window.location.search);
        const redirectTarget = params.get('redirect') || '../smarttour_home_2/code.html';

        setTimeout(() => {
          window.location.assign(redirectTarget);
        }, 700);

      } catch (err) {
        showError(err.message || 'Unable to connect to the authentication server. Please check that backend is running on port 8081.');
      } finally {
        submitBtn.disabled = false;
        btnSpinner.classList.add('hidden');
        btnArrow.classList.remove('hidden');
        btnText.textContent = 'Sign In to TravelBuddy';
      }
    }

    function showError(msg) {
      const errBox = document.getElementById('login-error-msg');
      const errText = document.getElementById('login-error-text');
      errText.textContent = msg;
      errBox.classList.remove('hidden');
    }
  </script>
  <!-- Multilingual Support (i18n) -->
  <script src="../translations.js"></script>
  <script src="../i18n.js"></script>
  <script src="../navigation.js"></script>
</body>
</html>
